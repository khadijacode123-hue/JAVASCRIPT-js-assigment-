    <h2>Add Students</h2>
    <form id="addStudentContainer" onsubmit="addStudent(event)">
        <label>Name : <input type="text" name="" id="studentName"></label>
        <label>Age : <input type="text" name="" id="studentAge"></label>
        <button type="submit">Add Action</button>

    </form>
    <table border="10">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Edit /delete</th>
            </tr>
        </thead>

        <tbody id="studentsTableBody">
         

        </tbody>
    </table>

    <div id="tableEditForm">
        <h2>Edit Students Details</h2>
        <form id="editStudenForm" onsubmit="saveChanges(event)">
            <label><input type="text" name="" id="editName"></label>
            <label><input type="text" name="" id="editAge"></label>
            <button type="submit">Save Changes</button>
            <button type="button" onclick="closeEditForm">Cancel</button>

        </form>


    </div>

    <script src="app.js"></script>
