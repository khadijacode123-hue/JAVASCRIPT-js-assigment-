<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- NAVBAR ============== -->
    <nav class="navbar bgColor ">
        <div class="container-fluid">
            <a class="navbar-brand text-light">SIT Post App</a>
            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                <button class="btn lightClr" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <!-- CARDS ================ -->
    <div class="container">
        <div class="row">

            <!-- post form == -->
            <div class="col-12 col-md-5 col-lg-4 mt-3">
                <div class="card p-3">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" placeholder="Enter your title here">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                        <textarea class="form-control" id="desc" rows="3"
                            placeholder="What's on your mind...'"></textarea>
                    </div>
                    <button class="btn postBtn" onclick="post()">Post</button>
                </div>
            </div>

            <!-- card container== -->

            <div class="col-12 col-md-7 col-lg-8 mt-3" id="postContainer">


            </div>


        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
